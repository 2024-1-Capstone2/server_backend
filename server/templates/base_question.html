{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html>
<head>
        <meta charset="utf-8" />
        <meta name="viewport" content="initial-scale=1, width=device-width" />
        <link
                rel="stylesheet"
                href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <title>{% block title %}{% endblock %}</title>
        <script src="https://cdn.jsdelivr.net/gh/sockjs/sockjs-client/dist/sockjs.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
        <link href="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.css" rel="stylesheet">
        <script src="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.js"></script>
        <link rel="stylesheet" type="text/css" href="{% static 'css/base.css' %}">
    <!--    링크 추가시 여기에 추가됨.-->
</head>
<body>
    <div class="flex h-screen bg-white">
      <div class="flex flex-col items-center w-1/4 p-4 bg-gray-200">
            <img
                    src="{% static 'images/general/question_logo.png' %}"
                    alt="Logo"
                    class="mb-4"
                    width="150"
                    height="1500"
                    style="aspect-ratio: 100 / 100; object-fit: cover;"
            />
            {% block message %}
            {% endblock %}
            <div class="add-message mt-4 flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-white text-primary-foreground hover:bg-primary/90 px-4 py-2 w-full text-break" style="height: auto;">
                &nbsp;
            </div>
        </div>
        <div class="flex flex-col justify-center w-3/4 p-8">
            <div class="w-full h-100 position-relative d-flex flex-column align-items-stretch" style="height: 600px;">
                {% block video_content %}
                <video id="webcam" class="position-absolute top-0 start-0 w-100 h-100" autoplay playsinline></video>
                <canvas class="output_canvas position-absolute top-0 start-0 w-100 h-100" id="output_canvas"></canvas>
                {% endblock video_content %}
            </div>
          <div class="flex items-center mt-4">
          <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center" style="border: 2px solid black;">
            <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="w-6 h-6"
            >
              <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path>
              <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path>
              <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path>
              <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path>
            </svg>
          </div>
          <div class="w-full h-12 bg-[#002f6c] ml-4 rounded-full text-white">
              <div class="detect_action flex h-full items-center justify-center">&nbsp;</div>
          </div>
        </div>
        <div class="flex items-center mt-4 justify-content-end">
          <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="w-6 h-6"
          >
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
            <path d="M21 3v5h-5"></path>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
            <path d="M8 16H3v5"></path>
          </svg>
          <p class="ml-2 text-sm">{% trans "If the sentence displayed on the screen was not what you intended, look at the camera and use the sign word 'again'." %}</p>
        </div>
      </div>
      </div>
    <script type="module" src="{% static 'js/ml.js' %}"></script>
    <script type="module" src="{% static 'js/socket.js' %}"></script>
</body>
</html>
